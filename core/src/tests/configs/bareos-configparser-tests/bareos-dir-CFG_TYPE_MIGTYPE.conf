Director {
  Name = "bareos-dir"
  Password = "secret"
}

Messages {
  Name = "Standard"
}

Pool {
  Name = "Full"
}

JobDefs {
  Name = "copy"
  Type = Copy
  Messages = "Standard"
  Pool = "Full"
}

Job {
  Name = "single"
  JobDefs = "copy"
  Selection Type = Job
}

Job {
  Name = "list"
  JobDefs = "copy"
  Selection Type = PoolUncopiedJobs, Client
}

Job {
  Name = "multiple-lines"
  JobDefs = "copy"
  Selection Type = PoolUncopiedJobs
  Selection Type = job       # keywords are case insensitive
  Selection Type = Job       # duplicates are ignored
}

JobDefs {
  Name = "jobdefs"
  Type = Copy
  Messages = "Standard"
  Pool = "Full"
  Selection Type = PoolTime, Volume
}

Job {
  Name = "inherited"
  JobDefs = "jobdefs"
}

Job {
  Name = "overridden"
  JobDefs = "jobdefs"
  Selection Type = SqlQuery
}
